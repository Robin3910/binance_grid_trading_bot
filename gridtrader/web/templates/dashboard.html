<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance Grid Trader Dashboard</title>
    <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Binance Grid Trader</h1>
            <div class="header-actions">
                <span id="connection-status" class="status-indicator">Connecting...</span>
                <button onclick="refreshAll()" class="btn-refresh">🔄 Refresh</button>
            </div>
        </header>

        <div class="main-content">
            <!-- 账户概览 -->
            <section class="card accounts-section">
                <h2>💰 账户概览</h2>
                <div id="accounts-container" class="accounts-grid">
                    <div class="loading">Loading...</div>
                </div>
                <div class="gateway-bar">
                    <span id="gateway-status"></span>
                    <button onclick="showGatewayModal()" class="btn-config">⚙️ Configure API</button>
                </div>
            </section>

            <!-- 策略管理 -->
            <section class="card strategies-section">
                <div class="section-header">
                    <h2>📈 策略管理</h2>
                    <div class="strategy-actions">
                        <select id="strategy-class-select" class="select-class" onchange="onStrategyClassChange()">
                            <option value="">Select Strategy Class</option>
                        </select>
                        <button onclick="showAddStrategyModal()" class="btn-add">+ Add Strategy</button>
                    </div>
                </div>

                <div class="strategy-controls">
                    <button onclick="initAllStrategies()" class="btn-control">Initialize All</button>
                    <button onclick="startAllStrategies()" class="btn-control btn-start">Start All</button>
                    <button onclick="stopAllStrategies()" class="btn-control btn-stop">Stop All</button>
                </div>

                <div id="strategies-container" class="strategies-list">
                    <div class="loading">Loading...</div>
                </div>
            </section>

            <!-- 持仓和订单 -->
            <div class="bottom-grid">
                <section class="card positions-section">
                    <h2>📋 持仓信息</h2>
                    <div id="positions-container" class="data-table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Symbol</th>
                                    <th>Direction</th>
                                    <th>Volume</th>
                                    <th>Price</th>
                                </tr>
                            </thead>
                            <tbody id="positions-tbody">
                                <tr><td colspan="4" class="loading">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </section>

                <section class="card orders-section">
                    <h2>📝 活动订单</h2>
                    <div id="orders-container" class="data-table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Symbol</th>
                                    <th>Direction</th>
                                    <th>Price</th>
                                    <th>Volume</th>
                                    <th>Traded</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="orders-tbody">
                                <tr><td colspan="7" class="loading">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>

            <!-- 日志区域 -->
            <section class="card log-section">
                <div class="log-header">
                    <h2>📜 日志</h2>
                    <button onclick="clearLogs()" class="btn-clear">Clear</button>
                </div>
                <div id="log-container" class="log-container">
                    <div class="loading">Loading...</div>
                </div>
            </section>
        </div>
    </div>

    <!-- 添加策略弹窗 -->
    <div id="add-strategy-modal" class="modal">
        <div class="modal-content modal-large">
            <span class="close" onclick="closeModal('add-strategy-modal')">&times;</span>
            <h2>Add New Strategy</h2>
            <form id="add-strategy-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>Strategy Name</label>
                        <input type="text" id="new-strategy-name" required placeholder="e.g., BTCGrid01">
                    </div>
                    <div class="form-group">
                        <label>Trading Symbol</label>
                        <input type="text" id="new-strategy-symbol" required placeholder="e.g., BTCUSDT">
                    </div>
                </div>
                <div id="dynamic-params"></div>
                <div id="compute-result" class="compute-result"></div>
                <button type="submit" class="btn-submit">Add Strategy</button>
            </form>
        </div>
    </div>

    <!-- 编辑策略弹窗 -->
    <div id="edit-strategy-modal" class="modal">
        <div class="modal-content modal-large">
            <span class="close" onclick="closeModal('edit-strategy-modal')">&times;</span>
            <h2>Edit Strategy: <span id="edit-strategy-name"></span></h2>
            <form id="edit-strategy-form">
                <div id="edit-dynamic-params"></div>
                <button type="submit" class="btn-submit">Save Changes</button>
            </form>
        </div>
    </div>

    <!-- 网关配置弹窗 -->
    <div id="gateway-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('gateway-modal')">&times;</span>
            <h2>Configure Exchange API</h2>
            <form id="gateway-form">
                <div class="form-group">
                    <label>Exchange</label>
                    <select id="gateway-select" onchange="onGatewaySelect()">
                        <option value="">Select Exchange</option>
                    </select>
                </div>
                <div id="gateway-fields"></div>
                <button type="submit" class="btn-submit">Connect</button>
            </form>
        </div>
    </div>

    <script>
        // API Base URL
        const API_BASE = '';

        // Global state
        let currentEditingStrategy = null;
        let strategyClasses = [];
        let gateways = [];
        let logs = [];
        let computeParams = ['upper_price', 'bottom_price', 'grid_number', 'order_volume', 'max_open_orders'];

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadGateways();
            loadStrategyClasses();
            loadStatus();
            loadLogs();

            // Auto refresh every 3 seconds
            setInterval(loadStatus, 3000);
            setInterval(loadLogs, 3000);

            // Setup form handlers
            document.getElementById('add-strategy-form').addEventListener('submit', handleAddStrategy);
            document.getElementById('edit-strategy-form').addEventListener('submit', handleEditStrategy);
            document.getElementById('gateway-form').addEventListener('submit', handleGatewayConnect);
        });

        // API Functions
        async function api(endpoint, options = {}) {
            try {
                const response = await fetch(API_BASE + endpoint, {
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    },
                    ...options
                });
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                return null;
            }
        }

        // ========== Gateway Functions ==========
        async function loadGateways() {
            const result = await api('/api/gateways');
            if (result && result.data) {
                gateways = result.data.gateways || [];
                updateGatewayStatus();
                updateGatewaySelect();
            }
        }

        function updateGatewayStatus() {
            const statusEl = document.getElementById('gateway-status');
            const connected = gateways.filter(g => g.connected);
            if (connected.length > 0) {
                statusEl.innerHTML = connected.map(g =>
                    `<span class="gateway-badge connected">${g.name}: Connected</span>`
                ).join(' ');
            } else {
                statusEl.innerHTML = '<span class="gateway-badge disconnected">No exchanges connected</span>';
            }
        }

        function updateGatewaySelect() {
            const select = document.getElementById('gateway-select');
            select.innerHTML = '<option value="">Select Exchange</option>';
            gateways.forEach(gw => {
                const option = document.createElement('option');
                option.value = gw.name;
                option.textContent = gw.name + (gw.connected ? ' (Connected)' : '');
                select.appendChild(option);
            });
        }

        function onGatewaySelect() {
            const gatewayName = document.getElementById('gateway-select').value;
            if (!gatewayName) {
                document.getElementById('gateway-fields').innerHTML = '';
                return;
            }

            const gateway = gateways.find(g => g.name === gatewayName);
            if (!gateway) return;

            const fieldsContainer = document.getElementById('gateway-fields');
            fieldsContainer.innerHTML = '';

            const defaultSetting = gateway.default_setting || {};
            Object.entries(defaultSetting).forEach(([key, value]) => {
                if (key === 'api_key' || key === 'key') {
                    // API Key 字段使用密码类型
                    const div = document.createElement('div');
                    div.className = 'form-group';
                    div.innerHTML = `
                        <label>${key} ${key === 'api_key' || key === 'key' ? '(API Key)' : ''}</label>
                        <input type="password" id="gateway-${key}" value="${value}" placeholder="Enter ${key}">
                    `;
                    fieldsContainer.appendChild(div);
                } else if (typeof value === 'boolean') {
                    const div = document.createElement('div');
                    div.className = 'form-group';
                    div.innerHTML = `
                        <label class="checkbox-label">
                            <input type="checkbox" id="gateway-${key}" ${value ? 'checked' : ''}>
                            ${key} (${key === 'testnet' ? 'Use Testnet' : key})
                        </label>
                    `;
                    fieldsContainer.appendChild(div);
                } else {
                    const div = document.createElement('div');
                    div.className = 'form-group';
                    div.innerHTML = `
                        <label>${key}</label>
                        <input type="${typeof value === 'number' ? 'number' : 'text'}"
                               id="gateway-${key}"
                               value="${value}"
                               step="any">
                    `;
                    fieldsContainer.appendChild(div);
                }
            });
        }

        async function handleGatewayConnect(e) {
            e.preventDefault();
            const gatewayName = document.getElementById('gateway-select').value;
            if (!gatewayName) return;

            const gateway = gateways.find(g => g.name === gatewayName);
            const settings = {};

            const defaultSetting = gateway.default_setting || {};
            Object.keys(defaultSetting).forEach(key => {
                const input = document.getElementById(`gateway-${key}`);
                if (!input) return;

                if (input.type === 'checkbox') {
                    settings[key] = input.checked;
                } else if (typeof defaultSetting[key] === 'number') {
                    settings[key] = parseFloat(input.value) || 0;
                } else {
                    settings[key] = input.value;
                }
            });

            const result = await api(`/api/gateways/${gatewayName}/connect`, {
                method: 'POST',
                body: JSON.stringify(settings)
            });

            if (result && result.success) {
                alert(`${gatewayName} connection initiated! Please wait for the connection to establish.`);
                closeModal('gateway-modal');
                loadStatus();
                setTimeout(loadGateways, 3000);
            }
        }

        function showGatewayModal() {
            document.getElementById('gateway-modal').style.display = 'block';
        }

        // ========== Strategy Class Functions ==========
        async function loadStrategyClasses() {
            const result = await api('/api/strategy-classes');
            if (result && result.data) {
                strategyClasses = result.data.classes || [];
                updateStrategyClassSelect();
            }
        }

        function updateStrategyClassSelect() {
            const select = document.getElementById('strategy-class-select');
            select.innerHTML = '<option value="">Select Strategy Class</option>';
            strategyClasses.forEach(cls => {
                const option = document.createElement('option');
                option.value = cls.class_name;
                option.textContent = cls.class_name;
                option.dataset.params = JSON.stringify(cls.parameters);
                select.appendChild(option);
            });
        }

        function onStrategyClassChange() {
            // Auto-fill strategy name suggestion based on class
            const className = document.getElementById('strategy-class-select').value;
            if (className) {
                const timestamp = Date.now().toString().slice(-4);
                document.getElementById('new-strategy-name').value = `${className.replace('Strategy', '')}${timestamp}`;
            }
        }

        // ========== Status Functions ==========
        async function loadStatus() {
            const result = await api('/api/status');
            if (result) {
                updateConnectionStatus(true);
                renderAccounts(result.accounts || []);
                renderStrategies(result.strategies || []);
                renderPositions(result.positions || []);
                loadOrders();
            } else {
                updateConnectionStatus(false);
            }
        }

        function updateConnectionStatus(connected) {
            const status = document.getElementById('connection-status');
            status.textContent = connected ? '🟢 Connected' : '🔴 Disconnected';
            status.className = 'status-indicator ' + (connected ? 'connected' : 'disconnected');
        }

        function renderAccounts(accounts) {
            const container = document.getElementById('accounts-container');
            if (accounts.length === 0) {
                container.innerHTML = '<div class="empty">No accounts connected. Please configure API first.</div>';
                return;
            }
            container.innerHTML = accounts.map(acc => `
                <div class="account-card">
                    <div class="account-gateway">${acc.gateway}</div>
                    <div class="account-balance">${acc.balance.toFixed(4)}</div>
                    <div class="account-frozen">Frozen: ${acc.frozen.toFixed(4)}</div>
                </div>
            `).join('');
        }

        function renderStrategies(strategies) {
            const container = document.getElementById('strategies-container');
            if (strategies.length === 0) {
                container.innerHTML = '<div class="empty">No strategies. Select a strategy class and click "Add Strategy" to get started!</div>';
                return;
            }
            container.innerHTML = strategies.map(s => `
                <div class="strategy-card ${s.trading ? 'trading' : ''}">
                    <div class="strategy-header">
                        <div class="strategy-name">${s.name}</div>
                        <div class="strategy-status ${s.trading ? 'status-trading' : 'status-stopped'}">
                            ${s.trading ? '🟢 Trading' : '🔴 Stopped'}
                        </div>
                    </div>
                    <div class="strategy-info">
                        <span class="strategy-symbol">${s.symbol}</span>
                        <span class="strategy-class">${s.class_name}</span>
                    </div>
                    <div class="strategy-params">
                        <div class="param-label">Parameters:</div>
                        <div class="param-grid">
                            ${Object.entries(s.parameters || {}).map(([k, v]) => `
                                <div class="param-item">
                                    <span class="param-key">${k}:</span>
                                    <span class="param-value">${typeof v === 'number' ? v.toFixed(4) : v}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="strategy-vars">
                        <div class="var-item">
                            <span class="var-key">Position:</span>
                            <span class="var-value ${s.variables?.pos > 0 ? 'positive' : s.variables?.pos < 0 ? 'negative' : ''}">${s.variables?.pos || 0}</span>
                        </div>
                        <div class="var-item">
                            <span class="var-key">Inited:</span>
                            <span class="var-value">${s.variables?.inited ? '✓' : '✗'}</span>
                        </div>
                    </div>
                    <div class="strategy-actions">
                        ${!s.variables?.inited ? `<button onclick="initStrategy('${s.name}')">Init</button>` : ''}
                        ${s.variables?.inited && !s.trading ? `<button onclick="startStrategy('${s.name}')" class="btn-start">Start</button>` : ''}
                        ${s.trading ? `<button onclick="stopStrategy('${s.name}')" class="btn-stop">Stop</button>` : ''}
                        ${!s.trading ? `
                            <button onclick="showEditModal('${s.name}')">Edit</button>
                            <button onclick="removeStrategy('${s.name}')" class="btn-remove">Remove</button>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function renderPositions(positions) {
            const tbody = document.getElementById('positions-tbody');
            if (positions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty">No positions</td></tr>';
                return;
            }
            tbody.innerHTML = positions.map(pos => `
                <tr>
                    <td>${pos.symbol}</td>
                    <td class="${pos.direction.includes('LONG') ? 'long' : 'short'}">${pos.direction}</td>
                    <td>${pos.volume.toFixed(4)}</td>
                    <td>${pos.price.toFixed(4)}</td>
                </tr>
            `).join('');
        }

        async function loadOrders() {
            const result = await api('/api/orders');
            if (result && result.data) {
                renderOrdersTable(result.data.orders || []);
            }
        }

        function renderOrdersTable(orders) {
            const tbody = document.getElementById('orders-tbody');
            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty">No active orders</td></tr>';
                return;
            }
            tbody.innerHTML = orders.map(order => `
                <tr>
                    <td>${order.symbol}</td>
                    <td class="${order.direction.includes('LONG') ? 'long' : 'short'}">${order.direction}</td>
                    <td>${order.price.toFixed(4)}</td>
                    <td>${order.volume.toFixed(4)}</td>
                    <td>${order.traded.toFixed(4)}</td>
                    <td><span class="status-badge ${order.status.toLowerCase()}">${order.status}</span></td>
                    <td><button onclick="cancelOrder('${order.vt_orderid}')" class="btn-cancel">Cancel</button></td>
                </tr>
            `).join('');
        }

        async function cancelOrder(vtOrderId) {
            if (!confirm('Cancel this order?')) return;
            await api(`/api/orders/${vtOrderId}/cancel`, { method: 'POST' });
            loadOrders();
        }

        // ========== Logs Functions ==========
        async function loadLogs() {
            const result = await api('/api/logs?limit=50');
            if (result && result.data) {
                logs = result.data.logs || [];
                renderLogs();
            }
        }

        function renderLogs() {
            const container = document.getElementById('log-container');
            if (logs.length === 0) {
                container.innerHTML = '<div class="empty">No logs</div>';
                return;
            }
            container.innerHTML = logs.map(log => {
                const levelClass = {
                    10: 'log-debug',
                    20: 'log-info',
                    30: 'log-warning',
                    40: 'log-error'
                }[log.level] || 'log-info';
                const levelName = {
                    10: 'DEBUG',
                    20: 'INFO',
                    30: 'WARN',
                    40: 'ERROR'
                }[log.level] || 'INFO';
                return `<div class="log-entry ${levelClass}">[${log.time || 'system'}] [${levelName}] ${log.msg}</div>`;
            }).join('');
            // Auto scroll to bottom
            container.scrollTop = container.scrollHeight;
        }

        function clearLogs() {
            logs = [];
            renderLogs();
        }

        // ========== Add Strategy Modal ==========
        function showAddStrategyModal() {
            const className = document.getElementById('strategy-class-select').value;
            if (!className) {
                alert('Please select a strategy class first from the dropdown');
                return;
            }

            const cls = strategyClasses.find(c => c.class_name === className);
            if (!cls) return;

            const paramsContainer = document.getElementById('dynamic-params');
            paramsContainer.innerHTML = '';

            // Generate form fields for all parameters
            Object.entries(cls.parameters).forEach(([key, value]) => {
                if (key === 'strategy_name' || key === 'vt_symbol') return;

                const div = document.createElement('div');
                div.className = 'form-group';
                const inputType = typeof value === 'number' ? 'number' : 'text';
                div.innerHTML = `
                    <label>${formatLabel(key)}</label>
                    <input type="${inputType}"
                           name="${key}"
                           id="add-${key}"
                           value="${value}"
                           step="any"
                           oninput="updateComputeResult()">
                `;
                paramsContainer.appendChild(div);
            });

            // Update compute result on input change
            updateComputeResult();

            document.getElementById('add-strategy-modal').style.display = 'block';
        }

        function formatLabel(key) {
            const labels = {
                'upper_price': 'Upper Price (USDT)',
                'bottom_price': 'Bottom Price (USDT)',
                'grid_number': 'Grid Number',
                'order_volume': 'Order Volume',
                'max_open_orders': 'Max Open Orders',
                'invest_coin': 'Invest Coin'
            };
            return labels[key] || key;
        }

        function updateComputeResult() {
            const upperPrice = parseFloat(document.getElementById('add-upper_price')?.value) || 0;
            const bottomPrice = parseFloat(document.getElementById('add-bottom_price')?.value) || 0;
            const gridNumber = parseFloat(document.getElementById('add-grid_number')?.value) || 0;
            const orderVolume = parseFloat(document.getElementById('add-order_volume')?.value) || 0;
            const maxOpenOrders = parseFloat(document.getElementById('add-max_open_orders')?.value) || 0;

            const container = document.getElementById('compute-result');

            if (upperPrice <= 0 || bottomPrice <= 0 || gridNumber <= 0 || orderVolume <= 0) {
                container.innerHTML = '';
                return;
            }

            const refPrice = (upperPrice + bottomPrice) / 2;
            const maxInvest = refPrice * maxOpenOrders * orderVolume;
            const perGridUSDT = refPrice * orderVolume;
            const stepPrice = (upperPrice - bottomPrice) / gridNumber;
            const perGridProfit = (stepPrice / refPrice * 100).toFixed(4);

            container.innerHTML = `
                <div class="compute-title">Estimated Calculation</div>
                <div class="compute-grid">
                    <div class="compute-item">
                        <span class="compute-label">Reference Price</span>
                        <span class="compute-value">${refPrice.toFixed(4)} USDT</span>
                    </div>
                    <div class="compute-item">
                        <span class="compute-label">Max Investment</span>
                        <span class="compute-value">${maxInvest.toFixed(4)} USDT</span>
                    </div>
                    <div class="compute-item">
                        <span class="compute-label">Per Grid (USDT)</span>
                        <span class="compute-value">${perGridUSDT.toFixed(4)} USDT</span>
                    </div>
                    <div class="compute-item">
                        <span class="compute-label">Per Grid Profit</span>
                        <span class="compute-value highlight">${perGridProfit}%</span>
                    </div>
                </div>
            `;
        }

        async function handleAddStrategy(e) {
            e.preventDefault();

            const className = document.getElementById('strategy-class-select').value;
            const strategyName = document.getElementById('new-strategy-name').value;
            const symbol = document.getElementById('new-strategy-symbol').value;

            const params = {};
            const formData = new FormData(e.target);
            for (const [key, value] of formData.entries()) {
                if (value && key !== 'strategy_name' && key !== 'vt_symbol') {
                    params[key] = isNaN(value) || value === '' ? value : parseFloat(value);
                }
            }

            const result = await api('/api/strategies', {
                method: 'POST',
                body: JSON.stringify({
                    class_name: className,
                    strategy_name: strategyName,
                    vt_symbol: symbol,
                    setting: params
                })
            });

            if (result && result.code === 0) {
                closeModal('add-strategy-modal');
                loadStatus();
                document.getElementById('new-strategy-name').value = '';
                document.getElementById('new-strategy-symbol').value = '';
            } else {
                alert('Failed to add strategy: ' + (result ? result.message : 'Unknown error'));
            }
        }

        // ========== Edit Strategy Modal ==========
        async function showEditModal(strategyName) {
            const result = await api(`/api/strategies/${strategyName}`);
            if (!result || !result.data) return;

            currentEditingStrategy = strategyName;
            const strategy = result.data;

            document.getElementById('edit-strategy-name').textContent = strategyName;

            const paramsContainer = document.getElementById('edit-dynamic-params');
            paramsContainer.innerHTML = '';

            Object.entries(strategy.parameters).forEach(([key, value]) => {
                const div = document.createElement('div');
                div.className = 'form-group';
                const inputType = typeof value === 'number' ? 'number' : 'text';
                div.innerHTML = `
                    <label>${formatLabel(key)}</label>
                    <input type="${inputType}"
                           name="${key}"
                           id="edit-${key}"
                           value="${value}"
                           step="any">
                `;
                paramsContainer.appendChild(div);
            });

            document.getElementById('edit-strategy-modal').style.display = 'block';
        }

        async function handleEditStrategy(e) {
            e.preventDefault();

            const params = {};
            const formData = new FormData(e.target);
            for (const [key, value] of formData.entries()) {
                if (value) {
                    params[key] = isNaN(value) || value === '' ? value : parseFloat(value);
                }
            }

            const result = await api(`/api/strategies/${currentEditingStrategy}`, {
                method: 'PUT',
                body: JSON.stringify({ setting: params })
            });

            if (result && result.success) {
                closeModal('edit-strategy-modal');
                loadStatus();
            } else {
                alert('Failed to edit strategy: ' + (result ? result.message : 'Unknown error'));
            }
        }

        // ========== Strategy Actions ==========
        async function initStrategy(name) {
            await api(`/api/strategies/${name}/init`, { method: 'POST' });
            setTimeout(loadStatus, 500);
        }

        async function startStrategy(name) {
            await api(`/api/strategies/${name}/start`, { method: 'POST' });
            setTimeout(loadStatus, 500);
        }

        async function stopStrategy(name) {
            await api(`/api/strategies/${name}/stop`, { method: 'POST' });
            setTimeout(loadStatus, 500);
        }

        async function removeStrategy(name) {
            if (!confirm(`Are you sure you want to remove strategy '${name}'?`)) return;
            await api(`/api/strategies/${name}`, { method: 'DELETE' });
            loadStatus();
        }

        async function initAllStrategies() {
            const result = await api('/api/strategies');
            if (result && result.data) {
                for (const s of result.data.strategies) {
                    if (!s.variables.inited) {
                        await api(`/api/strategies/${s.strategy_name}/init`, { method: 'POST' });
                    }
                }
                loadStatus();
            }
        }

        async function startAllStrategies() {
            const result = await api('/api/strategies');
            if (result && result.data) {
                for (const s of result.data.strategies) {
                    if (s.variables.inited && !s.vading) {
                        await api(`/api/strategies/${s.strategy_name}/start`, { method: 'POST' });
                    }
                }
                loadStatus();
            }
        }

        async function stopAllStrategies() {
            const result = await api('/api/strategies');
            if (result && result.data) {
                for (const s of result.data.strategies) {
                    if (s.variables.trading) {
                        await api(`/api/strategies/${s.strategy_name}/stop`, { method: 'POST' });
                    }
                }
                loadStatus();
            }
        }

        // ========== Utility Functions ==========
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function refreshAll() {
            loadStatus();
            loadLogs();
            loadGateways();
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        }
    </script>
</body>
</html>
